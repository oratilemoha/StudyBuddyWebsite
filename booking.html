 <h1>Book a Tutoring Session</h1>

<p>Complete the form below to request a tutoring session.</p>

<form>

    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name"><br><br>

    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email"><br><br>

    <label for="subject">Choose a Subject:</label><br>
    <select id="subject" name="subject">
        <option value="mathematics">Mathematics</option>
        <option value="accounting">Accounting</option>
        <option value="programming">Programming</option>
    </select><br><br>

    <label for="date">Preferred Date:</label><br>
    <input type="date" id="date" name="date"><br><br>

    <button type="button" onclick="alert('Your tutoring session has been booked successfully!')">Book Session</button>

</form>
</body>
