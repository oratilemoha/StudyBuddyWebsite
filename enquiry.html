    <h1>StudyBuddy Enquiry</h1>

    <p>Complete the form below if you would like to ask about our tutoring services.</p>

    <form id="enquiryForm">

        <label for="enquiryName">Full Name:</label><br>
        <input type="text" id="enquiryName" required minlength="3"><br><br>

        <label for="enquiryEmail">Email Address:</label><br>
        <input type="email" id="enquiryEmail" required><br><br>

        <label for="enquirySubject">Subject:</label><br>
        <select id="enquirySubject" required>
            <option value="">Select a subject</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Accounting">Accounting</option>
            <option value="Programming">Programming</option>
        </select><br><br>

        <label for="enquiryMessage">Enquiry:</label><br>
        <textarea id="enquiryMessage" rows="5" required minlength="10"></textarea><br><br>

        <button type="submit">Send Enquiry</button>

    </form>

    <script src="js/script.js"></script>

</body>

</html>
