    <h1>Contact StudyBuddy</h1>

    <p>
        If you have any questions about our tutoring services,
        please contact us using the form below.
    </p>
    <h2>Our Location</h2>

<iframe
    src="https://www.google.com/maps?q=Johannesburg,Gauteng&output=embed"
    width="100%"
    height="300"
    style="border:0;"
    allowfullscreen=""
    loading="lazy">
</iframe>
        

    <form id ="contactForm">

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required minlength="3"><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" required minlength="10"></textarea><br><br>

        <button type="submit">Send Message</button>
    </form>
<script src="js/script.js"></script>

</body>
